<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dota 2 Market Parser</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Dota 2 Market Parser</h1>

    <p class="subtitle">
        Поиск предметов по названию, качеству и описанию
    </p>


    <!-- =========================
         ФОРМА ПОИСКА
         ========================= -->

    <div class="search-form">

        <label for="item-name">
            Название предмета
        </label>

        <input
            id="item-name"
            type="text"
            placeholder="Например: Fractal Horns of Inner Abysm"
        >


        <!-- Выбор качества -->

        <label>
            Качество
        </label>

        <div class="quality-selector">

            <button
                type="button"
                id="quality-button"
                class="quality-button"
            >
                <span id="quality-button-text">
                    Все качества
                </span>

                <span class="quality-arrow">
                    ▼
                </span>
            </button>

            <div
                id="quality-dropdown"
                class="quality-dropdown"
            >

                <label class="quality-option">
                    <input
                        type="checkbox"
                        name="quality"
                        value="all"
                        checked
                    >
                    <span>Все</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        name="quality"
                        value="normal"
                    >
                    <span>Обычный</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        name="quality"
                        value="exalted"
                    >
                    <span>Exalted</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        name="quality"
                        value="inscribed"
                    >
                    <span>Inscribed</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        name="quality"
                        value="autographed"
                    >
                    <span>Autographed</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        name="quality"
                        value="heroic"
                    >
                    <span>Heroic</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        name="quality"
                        value="corrupted"
                    >
                    <span>Corrupted</span>
                </label>

            </div>
        </div>


        <!-- Описание -->

        <label for="description">
            Описание
        </label>

        <input
            id="description"
            type="text"
            placeholder="Например: Tnim S'nnam"
        >


        <!-- Кнопка -->

        <button
            id="search-button"
            type="button"
        >
            Найти
        </button>

    </div>


    <!-- =========================
         ПРОГРЕСС ПОИСКА
         ========================= -->

    <div
        id="progress-container"
        class="search-progress"
        style="display: none;"
    >

        <div class="progress-header">

            <div
                id="progress-stage"
                class="progress-stage"
            >
                Подготовка поиска
            </div>

            <div
                id="progress-percent"
                class="progress-percent"
            >
                0%
            </div>

        </div>


        <!-- Полоса прогресса -->

        <div class="progress-bar">

            <div
                id="progress-fill"
                class="progress-fill"
                style="width: 0%;"
            ></div>

        </div>


        <!-- Текущее действие -->

        <div
            id="progress-message"
            class="progress-message"
        >
            Подготавливаем поиск...
        </div>


        <!-- Подробная информация -->

        <div
            id="progress-details"
            class="progress-details"
        >
            Ожидание начала поиска...
        </div>

    </div>


    <!-- =========================
         РЕЗУЛЬТАТЫ
         ========================= -->

    <div id="results">

        <div class="message">
            Результаты поиска появятся здесь.
        </div>

    </div>

</div>


<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>

</body>
</html>
