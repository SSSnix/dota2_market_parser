<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dota 2 Market Parser</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Dota 2 Market Parser</h1>

    <p class="subtitle">
        Поиск предметов по названию, качеству и описанию
    </p>

    <div class="search-form">

        <label for="item-name">
            Название предмета
        </label>

        <input
            id="item-name"
            type="text"
            placeholder="Например: Fractal Horns of Inner Abysm"
        >

        <label>
            Качество
        </label>

        <div class="quality-selector">

            <button
                type="button"
                id="quality-button"
                class="quality-button"
            >
                <span id="quality-button-text">
                    Все качества
                </span>

                <span class="quality-arrow">
                    ▼
                </span>
            </button>

            <div
                id="quality-dropdown"
                class="quality-dropdown"
            >

                <label class="quality-option">
                    <input
                        type="checkbox"
                        value="all"
                        checked
                    >
                    <span>Все</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        value="normal"
                    >
                    <span>Обычный</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        value="exalted"
                    >
                    <span>Exalted</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        value="inscribed"
                    >
                    <span>Inscribed</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        value="autographed"
                    >
                    <span>Autographed</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        value="heroic"
                    >
                    <span>Heroic</span>
                </label>

                <label class="quality-option">
                    <input
                        type="checkbox"
                        value="corrupted"
                    >
                    <span>Corrupted</span>
                </label>

            </div>
        </div>

        <label for="description">
            Описание
        </label>

        <input
            id="description"
            type="text"
            placeholder="Например: Tnim S'nnam"
        >

        <button id="search-button">
            Найти
        </button>

    </div>

    <div id="results">
        Результаты поиска появятся здесь.
    </div>

</div>

<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>

</body>
</html>
