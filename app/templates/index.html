<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dota 2 Market Parser</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Dota 2 Market Parser</h1>

    <p>
        Поиск предметов по названию и описанию
    </p>

    <div class="search-form">

        <label for="item-name">
            Название предмета
        </label>

        <input
            id="item-name"
            type="text"
            placeholder="Например: Dragonclaw Hook"
        >

        <label for="description">
            Описание
        </label>

        <input
            id="description"
            type="text"
            placeholder="Например: Exalted"
        >

        <button id="search-button">
            Найти
        </button>

    </div>

    <div id="results">
        Результаты поиска появятся здесь.
    </div>

</div>

<script src="{{ url_for('static', path='js/app.js') }}"></script>

</body>
</html>
